<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171020"><title>Атомы волшебства — Карина Чен</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff5e8;font-family:Georgia,serif;background:radial-gradient(ellipse at 80% 0%,#653f5d,transparent 50%),radial-gradient(ellipse at 0% 90%,#362540,transparent 55%),#130d19}.app{position:relative;max-width:560px;margin:auto;padding:calc(30px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));min-height:100vh}.app:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#ffdab1 0.7px,transparent 1px);background-size:29px 42px;opacity:.20}header,.calendar,footer{position:relative}header{text-align:center}.eyebrow{font:10px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#e0c198}h1{font-size:clamp(38px,10vw,58px);font-weight:400;line-height:1;margin:17px 0 10px;background:linear-gradient(110deg,#fff9ec,#d8b381,#fff8e8);background-clip:text;-webkit-background-clip:text;color:transparent}.subtitle{font-style:italic;font-size:17px;color:#ead1bf}.ornament{margin:17px;color:#e4c695;letter-spacing:9px}.intro{font:12px/1.65 Arial,sans-serif;color:#e0d0df;max-width:360px;margin:0 auto 25px}.calendar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.day{appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:98px;padding:8px 2px;border:1px solid #bd977f82;border-radius:10px;background:linear-gradient(145deg,#855b7950,#26152cdb);color:#f4d5ae;cursor:pointer;box-shadow:0 6px 15px #0004;transition:transform .15s,border-color .15s}.day:active{transform:scale(.96)}.day:focus-visible{outline:2px solid #efca95}.symbol{font-size:15px}.date{font-size:29px;line-height:1}.month{font:8px Arial,sans-serif;letter-spacing:.5px;color:#d1b6c8;text-transform:uppercase}footer{text-align:center;font:11px/1.7 Arial,sans-serif;color:#d4bfcb;margin-top:23px}.brand{display:block;letter-spacing:2px;font-size:9px;color:#a98fa9;margin-top:16px}.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:#090611de;backdrop-filter:blur(7px)}.overlay[hidden]{display:none}.modal{position:relative;width:min(100%,460px);max-height:85vh;overflow:auto;padding:44px 26px 28px;border:1px solid #c8a679a0;border-radius:16px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#6a435e,transparent 75%),#201426;box-shadow:0 20px 65px #000b}.close{position:absolute;top:12px;right:12px;width:33px;height:33px;border-radius:50%;border:1px solid #d1b08d66;background:none;color:#f0d2ad;font:22px Arial;cursor:pointer}.md{color:#e5bc86;font:10px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase}.mi{font-size:36px;color:#e8c494;margin:20px 0}.mt{font-size:30px;font-weight:400;line-height:1.16;margin:0 0 17px}.mc{font:14px/1.75 Arial,sans-serif;color:#e1d3e0}.mk{font:10px Arial,sans-serif;letter-spacing:1.5px;color:#caacbc;text-transform:uppercase;margin:23px 0}.back{border:1px solid #e2c08c;background:#e2c08c;color:#2a1b2a;padding:13px 25px;border-radius:28px;cursor:pointer}@media(max-width:380px){.app{padding-left:10px;padding-right:10px}.calendar{gap:6px}.day{min-height:79px}.date{font-size:24px}.symbol{font-size:12px}}@media(prefers-reduced-motion:reduce){.day{transition:none}}
</style></head><body><main class="app"><header><div class="eyebrow">Карина Чен · Новогодний адвент 2026</div><h1>Атомы<br>волшебства</h1><div class="subtitle">15 дней навстречу себе</div><div class="ornament">✧ ✦ ✧</div><p class="intro">16–30 ноября · Выбирай дату и узнавай, что ждёт тебя в этот день. Сейчас открыт тестовый просмотр программы.</p></header><section id="calendar" class="calendar" aria-label="Даты адвента"></section><footer>Нажми на любое окошко, чтобы открыть описание<span class="brand">KARINA CHEN · АТОМЫ ВОЛШЕБСТВА</span></footer></main><div class="overlay" id="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><button class="close" id="close" aria-label="Закрыть">×</button><div class="md" id="md"></div><div class="mi" id="mi"></div><h2 class="mt" id="mt"></h2><div class="mc" id="mc"></div><div class="mk" id="mk"></div><button class="back" id="back">К календарю</button></section></div>
<script>
const DAYS=[
["Точка А. Где я сейчас?","Нежное знакомство с собой сегодняшней: какие чувства и мысли сопровождают тебя прямо сейчас?","Саморефлексия и МАК-карта","✧"],
["Моя внутренняя Вселенная","Авторская медитация Карины «Вселенная реальности» — время побыть наедине с собой.","Медитация","☾"],
["Мои истинные желания","Вспоминаем, чего хочется именно тебе, и выбираем три важных желания на 2027 год.","МАК-карта и небольшое задание","✦"],
["Почему мы ждём подходящего момента?","Вспоминаем одно желание, которое давно откладываем, и замечаем привычку ждать.","Лёгкая практика","⌛"],
["Разговор с сердцем","Медитация «Сердце» — мягкая пауза среди повседневной суеты.","Медитация","♡"],
["Новая страница моей жизни","Что нового хотелось бы впустить в свою жизнь? Поищем ответ с помощью МАК-карты.","МАК-карта","✧"],
["Маленькие радости большой жизни","Медитация «Радость» и внимание к приятным моментам, из которых складывается день.","Медитация","☼"],
["Отношения и личные границы","О близости, взаимном уважении и бережном отношении к своим границам.","Короткий урок","♡"],

["Мой внутренний ресурс","Одна МАК-карта, чтобы заметить, что поддерживает тебя сегодня.","МАК-карта","✦"],
["Волшебный подарок","Особенный подарок Карины: знакомство с её авторскими метафорическими картами.","Подарок","✴"],
["Почему одного осознания недостаточно?","Короткий подкаст о том, как понимание себя связано с реальными шагами.","Подкаст","◎"],
["Поддержка Вселенной","Вспоминаем всё хорошее и благодарим людей, события и самих себя.","МАК-карта и письмо благодарности","✧"],
["Мои открытия","Замечаем, что узнали о себе за эти дни, и выбираем одну мысль, которую хочется забрать с собой.","Лёгкая рефлексия","✦"],
["Моя новая глава","Подводим итоги, мечтаем о 2027 годе и встречаемся с Кариной на завершающем эфире.","Итоговый эфир","✴"]
];
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.setHeaderColor("#171020");tg?.setBackgroundColor("#130d19")}catch(e){}
const grid=document.getElementById("calendar"),overlay=document.getElementById("overlay");let last=null;
function dismiss(){overlay.hidden=true;last?.focus()}
DAYS.forEach((d,i)=>{const b=document.createElement("button");b.type="button";b.className="day";b.setAttribute("aria-label",(i+16)+" ноября: "+d[0]);b.innerHTML='<span class="symbol">'+d[3]+'</span><span class="date">'+(i+16)+'</span><span class="month">ноября</span>';b.addEventListener("click",()=>{last=b;document.getElementById("md").textContent=(i+16)+" ноября · День "+(i+1);document.getElementById("mi").textContent=d[3];document.getElementById("mt").textContent=d[0];document.getElementById("mc").textContent=d[1];document.getElementById("mk").textContent=d[2];overlay.hidden=false;document.getElementById("close").focus();try{tg?.HapticFeedback?.impactOccurred("light")}catch(e){}});grid.appendChild(b)});
document.getElementById("close").addEventListener("click",dismiss);document.getElementById("back").addEventListener("click",dismiss);overlay.addEventListener("click",e=>{if(e.target===overlay)dismiss()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!overlay.hidden)dismiss()});
</script></body></html>
